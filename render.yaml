# Render Blueprint — 写真解析バックエンドを無料枠にデプロイする定義
# 使い方: Renderダッシュボード → New → Blueprint → このリポジトリを選択
# ANTHROPIC_API_KEY・APP_SHARED_SECRET・UPSTASH_REDIS_REST_URL・UPSTASH_REDIS_REST_TOKEN は
# 作成時にダッシュボードで入力する（sync: false）
services:
  - type: web
    name: mito-meal-analyzer
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_SHARED_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DEVICE_DAILY_LIMIT
        value: "6"
      - key: GLOBAL_DAILY_COST_USD
        value: "1.5"
